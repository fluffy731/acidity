name: acidic
services:
  app:
    image: acidic:local
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      ACIDIC_MODE: preview
    ports:
      - "3100:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      ACIDIC_DOMAIN: ${ACIDIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
